[project]
name = "safe-rl-cbf"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "numpy", "casadi", "stable-baselines3==2.3.2", "gymnasium>=0.28,<0.29",
    "wandb", "matplotlib", "gpytorch", "torch", "pyyaml",
    "protobuf>=5,<8,!=5.28.0,!=5.29.0",
]

[project.optional-dependencies]
dev = ["pytest", "ruff==0.16.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]